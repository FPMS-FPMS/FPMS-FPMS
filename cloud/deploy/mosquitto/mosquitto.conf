# FPMS cloud broker.
#
# Two listeners with deliberately different exposure:
#   8883 — TLS, internet-facing. Field rovers on cellular connect here.
#   1883 — plaintext, container network only. The dashboard uses this; compose
#          binds it to 127.0.0.1 on the host so it is never reachable publicly.
#
# Anonymous access is off on both. Rovers authenticate with the account in
# /mosquitto/config/passwd.

per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd

# --- field rovers: MQTT over TLS -------------------------------------------
listener 8883
protocol mqtt
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
# Rovers authenticate with username/password over TLS rather than client
# certificates: far less to go wrong when provisioning hardware in the field,
# and the credential is revocable by editing one password file.
require_certificate false
tls_version tlsv1.2

# --- dashboard: plaintext on the internal network only --------------------
listener 1883
protocol mqtt

# --- durability ------------------------------------------------------------
# Queued messages survive a broker restart, so an alert published while the
# dashboard is reconnecting is not lost.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
