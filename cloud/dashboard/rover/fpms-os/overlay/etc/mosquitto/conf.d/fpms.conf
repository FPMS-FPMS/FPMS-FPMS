# /etc/mosquitto/conf.d/fpms.conf   (mode 0600, mosquitto:mosquitto)
#
# The rover's local broker, and the bridge that carries its traffic to the
# operator laptop.
#
# WHY THE BROKER IS ON THE ROVER AT ALL
# ====================================
# An earlier setup pointed every rover service straight at a broker on the
# laptop. That put a WiFi round trip on the Nav2-critical path and the LiDAR
# arrived at 2.37 Hz against a healthy ~9.8 Hz. Services now talk to localhost
# and mosquitto deals with the network.

# ---------------------------------------------------------------------------
# LISTENER
# ---------------------------------------------------------------------------
#
# All interfaces, deliberately. THE PI LISTENS, THE LAPTOP DIALS OUT.
# The operator laptop's Windows Firewall has no inbound rule for 1883 and there
# is no admin account to add one, so an outbound connection from the laptop is
# the only direction that works. Nothing on this rover may bind loopback-only.
listener 1883

# No websocket listener. Nothing in the rover path uses MQTT-over-WS - browsers
# reach ROS data through rosbridge on 9090. (A `listener 9001 protocol
# websockets` does appear in cloud/localstack/mosquitto.conf; that is a local
# dev stand-in for AWS IoT Core, not this broker. Do not copy it here.)

allow_anonymous false
password_file /etc/mosquitto/fpms.passwd

# Per-client-id topic authorisation. Before FPMS-OS there were no ACLs at all,
# which meant any authenticated client could publish commands/stop - or a
# mission - to any thing on the fleet.
acl_file /etc/mosquitto/fpms.acl

# ---------------------------------------------------------------------------
# MESSAGE SIZE
# ---------------------------------------------------------------------------
#
# NOT SET, deliberately, which leaves mosquitto's default of unlimited.
#
# If you ever add message_size_limit, it MUST stay above 262144. Camera frames
# are base64 JPEG - measured at ~28 KB at the shipped quality 40 / 6 fps, and
# the cloud ingest path caps a whole batch at 256 KB. A limit set too low does
# not error: the broker silently drops the publish and the camera feed simply
# stops, which is the hardest version of this failure to diagnose.

# ---------------------------------------------------------------------------
# PERSISTENCE
# ---------------------------------------------------------------------------
#
# Off (the default). This is correct here and not an oversight. Rover telemetry
# is only meaningful live; a replayed scan is a lie about where the walls are.
# The dashboard shows telemetry AGE rather than trusting the last value it
# received, precisely so that stale data cannot masquerade as current.
persistence false

# ---------------------------------------------------------------------------
# BRIDGE TO THE OPERATOR LAPTOP
# ---------------------------------------------------------------------------
#
# 192.168.137.1 is the Windows Mobile Hotspot gateway - the laptop. This is the
# real address in use. CONNECT-ROVERS.md's 192.168.0.27 (router LAN) is stale;
# the rover sits on the hotspot subnet.
#
# fpms-firstboot rewrites this address if the operator supplies a different one
# on the boot partition.
connection laptop-bridge
address 192.168.137.1:1883

# `both 0` - bidirectional, QoS 0.
#
# THE CONSEQUENCE, AND IT IS IMPORTANT: the QoS 1 guarantees on events/#,
# commands/* and telemetry/mission_plan hold only WITHIN the rover. Across this
# bridge, on a saturated link, messages are DROPPED, not queued. That is why
# the dashboard ages telemetry forward from receipt rather than trusting a
# timestamp inside the payload, and why an alert that matters is also spooled
# to disk by the cloud uplink path rather than relying on this bridge.
topic # both 0

remote_username fpms
# Password comes from the bridge credentials file written by fpms-firstboot.
# It is NOT in this file, and this file is 0600 regardless.
remote_password __FPMS_FIRSTBOOT_WILL_REPLACE_THIS__

bridge_attempt_unsubscribe false
start_type automatic
restart_timeout 5

# A clean session each time. The rover must not resume a subscription state
# from a previous era and start replaying it.
cleansession true

# Do not let a dead bridge look like a healthy one. mosquitto logs the
# connection state; fpms-selftest reads it and reports the bridge separately
# from the local listener, because "the broker is up" and "the laptop can see
# us" are different questions and have been confused before.
notifications true
