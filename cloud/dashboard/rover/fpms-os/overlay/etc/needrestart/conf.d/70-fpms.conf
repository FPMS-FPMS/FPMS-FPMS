# FPMS-OS: needrestart may LIST what wants restarting. It may never do it.
#
# WHY
# ===
# needrestart runs automatically after apt transactions on Ubuntu 22.04 and,
# in its default non-interactive mode, restarts services it judges to be using
# deleted libraries. Its judgement is sound for a web server. It is wrong here,
# for reasons it has no way to know:
#
#   micro-ros-agent    A restart drops the serial session to the ESP32-S3 and
#                      the re-link takes a MEASURED 90-225 s. During that
#                      window the board has no agent, the deadman fires, and
#                      the rover is a brick that looks powered.
#
#   fpms-cored         Restarting the core is a window with NO STOP AUTHORITY.
#                      There is no acceptable time for that to happen without
#                      a human deciding it, and certainly not chosen by a
#                      library-dependency heuristic.
#
#   fpms-missions      If a mission is running, a restart abandons the rover
#                      mid-leg with duty on the wire and no executor left to
#                      take it off.
#
# The general principle this file encodes: on this machine, DECIDING to restart
# something is an operator action, because only the operator knows whether the
# rover is currently moving. A tool that cannot know that must not choose.
#
# 'l' = list only. needrestart still reports what it believes needs a restart,
# which is the useful half, and `fpms-update` surfaces it. Nothing is hidden;
# only the automatic action is removed.
$nrconf{restart} = 'l';

# Do not offer to reboot for a new kernel either. The kernel is pinned (see
# /etc/apt/preferences.d/fpms-kernel) precisely so it does not change, so a
# kernel hint here is either noise or a warning that the pin has been defeated
# - and in the second case a reboot is the LAST thing wanted before someone
# has looked at why.
$nrconf{kernelhints} = 0;

# Belt and braces: never restart these by name, whatever the mode is set to.
# The list is deliberately the units whose restart has a physical consequence
# on the rover, not every FPMS unit - a dashboard or telemetry restart is
# harmless and blocking it would only hide a real need.
$nrconf{override_rc} = {
    qr(^micro-ros-agent) => 0,
    qr(^fpms-cored)      => 0,
    qr(^fpms-missions)   => 0,
    qr(^fpms-rover-agent)=> 0,
    qr(^fpms-uros)       => 0,
};
