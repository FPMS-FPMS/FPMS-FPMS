# FPMS-OS build configuration.
#
# Sourced by build.sh. Everything version-pinned lives here so a build is
# reproducible and so `git log` on this one file tells you what changed
# between two images.

FPMS_OS_VERSION="1.0.0"

# ---------------------------------------------------------------------------
# BASE IMAGE
# ---------------------------------------------------------------------------
#
# Joshua Riek's ubuntu-rockchip for the Orange Pi 5B. This is the right base
# and the choice is not really open:
#
#   - ROS 2 Humble has no supported build on anything but Ubuntu 22.04, and
#     its rclpy extensions are cpython-310 binaries. That pins the release.
#   - The RK3588S NPU has NO mainline kernel driver. rknpu, and therefore
#     YOLO26 on the NPU, exists only in Rockchip's BSP kernel. So does the
#     Mali GPU and the bcmdhd WiFi driver.
#   - Building a kernel from scratch would forfeit all three to gain nothing
#     this project needs.
#
# FPMS-OS owns everything above that kernel: boot sequence, service set,
# device naming, DDS transport, safety ordering, provisioning, self-test.
#
# VERIFY THE URL AND SHA BEFORE A RELEASE BUILD. Upstream re-cuts releases and
# the build refuses to continue on a checksum mismatch rather than silently
# building on something else.
BASE_IMAGE_NAME="ubuntu-22.04-preinstalled-server-arm64-orangepi-5b"
BASE_IMAGE_URL="https://github.com/Joshua-Riek/ubuntu-rockchip/releases/download/v2.4.0/ubuntu-22.04.4-preinstalled-server-arm64-orangepi-5b.img.xz"
BASE_IMAGE_SHA256="__SET_ME__"

# Refuse to build until somebody has actually checked the checksum. An image
# built on an unverified base is not a reproducible image.
BASE_IMAGE_REQUIRE_SHA=1

# ---------------------------------------------------------------------------
# ROS
# ---------------------------------------------------------------------------
ROS_DISTRO="humble"
ROS_DOMAIN_ID="20"
RMW_IMPLEMENTATION="rmw_fastrtps_cpp"

# ---------------------------------------------------------------------------
# PYTHON PINS - each of these has cost this project real time
# ---------------------------------------------------------------------------
#
# paho >= 2.0: apt ships 1.6.1, which has no CallbackAPIVersion. Five files
# import that symbol unguarded, INCLUDING fpms_cored.py, the STOP authority.
# An image built on the apt package has no emergency stop and no telemetry,
# and the only evidence is a unit quietly restart-looping.
PIP_PAHO="paho-mqtt>=2.0,<3"

# numpy < 2: ROS Humble's C extensions are built against the 1.x ABI. A 2.x
# breaks tf_transformations with "np.maximum_sctype was removed".
PIP_NUMPY="numpy<2"

# websocket-client, NOT websockets. Different library, same-looking name.
PIP_WEBSOCKET="websocket-client"

# ---------------------------------------------------------------------------
# NPU
# ---------------------------------------------------------------------------
#
# rknn-toolkit-lite2 is a Rockchip aarch64 wheel and is NOT on PyPI. It must
# be version-matched to librknnrt.so, which in turn must match the kernel's
# rknpu driver. Nobody ever wrote down which version the old Pi ran -
# bench_npu.py reads it at runtime from /sys/kernel/debug/rknpu/version.
# FPMS-OS pins both halves and records them in /etc/fpms/versions.json.
RKNN_TOOLKIT2_TAG="v2.3.0"
RKNN_LITE_WHEEL_URL="https://github.com/airockchip/rknn-toolkit2/raw/${RKNN_TOOLKIT2_TAG}/rknn-toolkit-lite2/packages/rknn_toolkit_lite2-2.3.0-cp310-cp310-manylinux_2_17_aarch64.manylinux2014_aarch64.whl"
LIBRKNNRT_URL="https://github.com/airockchip/rknn-toolkit2/raw/${RKNN_TOOLKIT2_TAG}/rknpu2/runtime/Linux/librknn_api/aarch64/librknnrt.so"

# ---------------------------------------------------------------------------
# IDENTITY
# ---------------------------------------------------------------------------
#
# The user MUST be `ubuntu` with home /home/ubuntu. This is not a preference:
# every unit hardcodes it, and three Python files hardcode absolute paths
# under it with no override (the teleop origin anchor in two places, and the
# YOLO directory default).
FPMS_USER="ubuntu"
FPMS_HOME="/home/ubuntu"

# fpms_console.py builds the URL it prints from socket.gethostname() + ".local"
# and every document says fpms-pi.local. A different hostname silently breaks
# all of them.
FPMS_HOSTNAME="fpms-pi"

# Rootfs headroom added before the chroot work, in MB. ROS Humble plus Nav2
# plus the micro-ROS workspace does not fit in the stock image.
ROOTFS_GROW_MB=6144
