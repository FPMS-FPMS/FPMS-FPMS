; ============================================================================
; FPMS V3 PlatformIO environment.
;
; APPEND this block to ~/lino/firmware/platformio.ini. Do not edit any existing
; env -- the point of a separate env is that the upstream tree stays intact and
; you can always build the old firmware again by naming the old env.
;
;   Build:  cd ~/lino/firmware && pio run -e fpms
;   Binary: .pio/build/fpms/firmware.bin
;
; deploy_fpms_v3.sh appends this automatically and pins the micro-ROS library.
; ============================================================================

[env:fpms]
platform = espressif32
board    = esp32-s3-devkitc-1
framework = arduino

; --- FLASH SIZE: 4MB. NOT 8MB. -------------------------------------------
; This board has 4MB of flash. An 8MB header caused a BOOT PANIC LOOP -- the
; bootloader reads a flash size it cannot address and resets forever, which
; looks exactly like a bad build. Both keys are set because the bootloader
; header and the upload tool read different ones.
board_upload.flash_size = 4MB
board_build.flash_size  = 4MB
; default.csv = the stock Arduino 2-OTA scheme that fits in 4MB (~1.25MB app).
; The default for this board id assumes 8MB and will not fit.
board_build.partitions  = default.csv

; --- SERIAL: the host link is a CP2102 on UART0 (GPIO43/44). --------------
; *** DO NOT ADD -D ARDUINO_USB_CDC_ON_BOOT. ***
; Upstream's stock esp32s3 env defines it, and on this board that is wrong:
; it rebinds `Serial` to the ESP32-S3's NATIVE USB peripheral, which is not
; wired to the CP2102 the Pi is plugged into. The symptom is a board that
; boots perfectly and is completely silent to micro_ros_agent. Explicitly
; zeroed rather than merely omitted, so that adding it later fails loudly.
build_flags =
    -I ../config
    -D USE_FPMS_CONFIG
    -D __PGMSPACE_H_
    -D ARDUINO_USB_CDC_ON_BOOT=0

; --- BAUD --------------------------------------------------------------
; 230400 everywhere. 921600 was measured unstable on this board (session died
; within 1-3 minutes, never established on cold boot, worse under motor load).
; MUST match BAUDRATE in fpms_config.h and the -b flag on the agent unit.
monitor_speed = 230400
upload_speed  = 921600     ; flashing only -- the ROM loader is reliable here

board_microros_transport = serial
board_microros_distro    = humble

lib_deps =
    ; PIN THIS. It is unpinned upstream, and a silent change to micro-ROS on
    ; the morning of Nationals is an unrecoverable failure. deploy_fpms_v3.sh
    ; rewrites the #sha below to whatever is currently checked out and working
    ; in .pio/libdeps -- i.e. it pins the version that already builds, rather
    ; than a version someone guessed.
    https://github.com/micro-ROS/micro_ros_platformio
    madhephaestus/ESP32Encoder
    https://github.com/arcao/Syslog
    Wire
    SPI
