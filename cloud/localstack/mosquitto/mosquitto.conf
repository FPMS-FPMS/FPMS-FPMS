# FPMS Mosquitto config — stands in for AWS IoT Core's MQTT broker locally.
#
# Two listeners:
#   1883/tcp  — plain MQTT for rovers, station, and the rule-bridge
#   9001/tcp  — MQTT-over-WebSockets for the public dashboard (browser)
#
# Anonymous auth is enabled because this is a local dev broker only. In production
# AWS IoT Core enforces per-thing X.509 certs — see cloud/iot-core/policies/.

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type warning
log_type error
log_type notice

listener 1883
protocol mqtt
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true

max_queued_messages 1000
message_size_limit 262144
